name: Integridad del juego
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Falla el build (y bloquea el merge) si se tocó la física o la perspectiva.
      - run: node verificar.js
